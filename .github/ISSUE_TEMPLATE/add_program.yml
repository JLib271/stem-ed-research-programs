name: Add a program
description: Suggest a graduate program or research group in STEM+ education research, including medical and health professions education.
title: "Add: <institution>, <discipline>"
labels: ["add program"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! A maintainer will check the details and add the program. Please do not include email addresses or other contact details.
  - type: input
    id: institution
    attributes:
      label: Institution
      description: University or college name, and country.
      placeholder: Example University, United States
    validations:
      required: true
  - type: input
    id: home_department
    attributes:
      label: Home department
      description: The department, school, or institute that grants the degree. Add partner units after "with".
      placeholder: Department of Chemistry, with the College of Education
    validations:
      required: true
  - type: checkboxes
    id: degree_types
    attributes:
      label: Degree types
      options:
        - label: BS
        - label: MA
        - label: MS
        - label: MEd
        - label: MAT
        - label: MHPE
        - label: EdD
        - label: PhD
        - label: Certificate
  - type: dropdown
    id: disciplines
    attributes:
      label: Discipline
      multiple: true
      options:
        - Agriculture
        - Bioscience
        - Chemistry
        - Earth Science
        - Engineering
        - Health Education (including medical and health professions education)
        - History & Philosophy of Science (including history of medicine and science and technology studies)
        - Human Dimensions (including human dimensions of natural resources, forestry, wildlife, and climate change)
        - Learning Science
        - Mathematics
        - Physics
        - Science & Health Communication (including risk and climate communication, public engagement, and science journalism)
        - Science Education
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    id: faculty
    attributes:
      label: Education research faculty
      description: Faculty who supervise education research students, one per line. List only people who agree to be listed or whom the program lists publicly.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Program or research group web page (optional)
  - type: input
    id: source
    attributes:
      label: Source
      description: Where this information comes from, for example the program's web page, or "I am faculty in this program."
    validations:
      required: true
